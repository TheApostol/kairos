name: Keep Backend Alive

# Render's free tier spins the backend down after ~15 min of no traffic, and
# a cold start takes 30-60+ seconds — during that window the dashboard hangs
# and the job worker (which only runs while the process is up) can't pick up
# pending scraper/enrichment jobs. Pinging /health well under that 15-minute
# window keeps the service awake.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -sf --max-time 30 https://kairos-anuu.onrender.com/health
