name: Build & Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'app/frontend/**'
      - '.github/workflows/build-frontend.yml'

jobs:
  build:
    # Skip if this push is itself from the build bot (prevents infinite loop)
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: app/frontend
        run: npm install --legacy-peer-deps

      - name: Build Next.js
        working-directory: app/frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://kairos-anuu.onrender.com

      - name: Commit build artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage .next artifacts and any tracked files modified by npm install
          git add -f app/frontend/.next
          git add -u
          git diff --staged --quiet || git commit -m "chore: auto-build frontend"
          # Discard any tracked-file changes left by npm (e.g. package-lock.json)
          git checkout -- .
          git pull --rebase origin main
          git push
